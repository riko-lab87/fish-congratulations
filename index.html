
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MISSION COMPLETE!｜おさかなマスター</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  color: #174d69;
  background: linear-gradient(180deg,#a8edfa,#d9f8fa 55%,#f4fded);
  overflow-x: hidden;
}
.sea {
  min-height: 100vh;
  padding: 35px 18px 55px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.card {
  max-width: 540px;
  margin: 25px auto;
  padding: 32px 22px;
  background: rgba(255,255,255,.82);
  border: 3px solid white;
  border-radius: 30px;
  box-shadow: 0 12px 35px #4b9eb333;
  position: relative;
  z-index: 2;
}
.label {
  display: inline-block;
  background: #fff0a8;
  color: #82611c;
  border-radius: 30px;
  padding: 8px 18px;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 2px;
}
h1 {
  font-size: clamp(27px,7vw,39px);
  line-height: 1.35;
  color: #1689a7;
  margin: 20px 0 8px;
}
.fish {
  font-size: 92px;
  display: inline-block;
  animation: swim 3s ease-in-out infinite;
  filter: drop-shadow(0 8px 5px #338e8e33);
}
@keyframes swim {
  0%   { transform: translateY(0) rotate(0deg); }
  25%  { transform: translateY(-10px) rotate(90deg); }
  50%  { transform: translateY(0) rotate(180deg); }
  75%  { transform: translateY(-10px) rotate(270deg); }
  100% { transform: translateY(0) rotate(360deg); }
}
h2 { color: #e28c42; font-size: 23px; }
p {
  font-size: 16px;
  line-height: 2;
}
.message {
  background: #effcff;
  border-radius: 20px;
  padding: 20px 16px;
  margin: 22px 0;
}
.stars { font-size: 24px; letter-spacing: 8px; }
.footer { font-size: 13px; color: #6d9eaa; }
.bubble {
  position: fixed;
  bottom: -40px;
  width: 15px;
  height: 15px;
  border: 2px solid #ffffffaa;
  border-radius: 50%;
  animation: rise 9s linear infinite;
}
.b1 { left: 10%; animation-delay: 0s; }
.b2 { left: 80%; animation-delay: 3s; width: 22px; height: 22px; }
.b3 { left: 55%; animation-delay: 5s; width: 10px; height: 10px; }
@keyframes rise {
  to { transform: translateY(-115vh); opacity: 0; }
}
</style>
</head>
<body>
<div class="sea">
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>

  <main class="card">
    <div class="label">SPECIAL FISH MISSION</div>
    <div class="fish">🐠</div>
    <div class="stars">★ ★ ★</div>

    <h1>MISSION<br>COMPLETE!!</h1>
    <h2>おさかな検定<br>合格おめでとう！</h2>

    <div class="message">
      <p>
        かわいい顔して、<br>なかなかやるじゃない！<br>
        見事、難関突破！！<br><br>
        たくさん学んで、たくさん考えて、<br>
        ついに合格をつかみ取ったね！
      </p>
      <p>
        これからも好奇心いっぱいに、<br>
        広い海の世界を探検してね！
      </p>
    </div>

    <div class="fish">🐟</div>
    <h2>YOU ARE A FISH MASTER!</h2>
    <p class="footer">
      君の未来は、まだまだ広い海の中！<br>
      これからも楽しい冒険を！
    </p>
    <div class="stars">🐚 🫧 🐬</div>
  </main>
</div>
</body>
</html>
